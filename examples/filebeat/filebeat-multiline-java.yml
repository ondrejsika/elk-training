filebeat.inputs:
  - type: stdin
    multiline:
      pattern: '^[[:space:]]+(at|\.{3})[[:space:]]+\b|^Caused by:'
      negate: false
      match: after

processors:
  - drop_fields:
      fields:
        - agent
        - log
        - input
        - ecs
        - host

output.console:
  pretty: true
