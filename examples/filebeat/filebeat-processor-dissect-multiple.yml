filebeat.inputs:
  - type: filestream
    paths:
      - /tmp/example-log-json.log
      - /tmp/example-log-text.log
      - /tmp/example-log-counter.log

processors:
  - add_tags:
      tags:
        - training-example
        - dissect-example
  - if:
      regexp:
        message: "^loggen"
    then:
      - add_labels:
          labels:
            message_type: loggen-text
      - dissect:
          # loggen 2026/10/13 12:37:43 DEBUG This is a debug log that shows a log that can be ignored. i=28 pet_kind=rat pet_name=Debie
          tokenizer: "%{module} %{date} %{time} %{level} %{message} i=%{i|integer} pet_kind=%{pet_kind} pet_name=%{pet_name}"
          field: "message"
          target_prefix: "dissect.loggen"
  - if:
      regexp:
        message: "^{"
    then:
      - add_labels:
          labels:
            message_type: loggen-json
      - decode_json_fields:
          fields:
            - message
          target: "json"
          add_error_key: true
  - if:
      regexp:
        message: "^\\d+"
    then:
      - add_labels:
          labels:
            message_type: counter
      - dissect:
          tokenizer: "%{counter|integer}"
          field: "message"
          target_prefix: "dissect.counter"

output.elasticsearch:
  hosts:
    - https://es.k8s.sikademo.com:443
  username: elastic
  password: elastic
