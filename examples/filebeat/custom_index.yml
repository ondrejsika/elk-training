filebeat.inputs:
  - type: stdin

processors:
  - decode_json_fields:
      fields:
        - message
      target: "message_json"
      add_error_key: true

setup.template.name: "logs"
setup.template.pattern: "logs-*"

output.elasticsearch:
  hosts: ["https://es.k8s.sikademo.com:443"]
  username: elastic
  password: elastic
  index: "logs-%{[message_json.level]}-%{[message_json.pet_kind]}"
